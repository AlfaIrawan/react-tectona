<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <link rel="preload" as="image" href="/images/background-1.png" fetchpriority="high" crossorigin="anonymous" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tectona project management platform" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tectona" />
    <title>Tectona - Project Management Platform</title>
    <!-- Sync ui-scale-lock before first paint (must match src/lib/uiScale.ts). -->
    <script>
      (function () {
        var DESIGN = 1920
        var EPS = 0.995
        var vw = window.innerWidth
        var vh = window.innerHeight
        var root = document.documentElement
        if (vw <= 0) return
        var scale = vw / DESIGN
        if (scale >= EPS) {
          root.classList.remove('ui-scale-lock')
          root.style.removeProperty('--ui-scale')
          root.style.removeProperty('--app-vw')
          root.style.removeProperty('--app-vh')
          return
        }
        root.style.setProperty('--ui-scale', String(scale))
        root.style.setProperty('--app-vw', DESIGN + 'px')
        root.style.setProperty('--app-vh', String(vh / scale) + 'px')
        root.classList.add('ui-scale-lock')
      })()
    </script>
    <!--
      Stale Workbox from a prior production/preview build on :9411 can keep serving
      old hashed /assets/*.js (mojibake Â·) even while Vite dev is running.
      Incognito works because it has no SW. Kill SW early on local hosts.
    -->
    <script>
      (function () {
        var host = location.hostname
        var isLocal = host === 'localhost' || host === '127.0.0.1'
        var isDevHost = host === 'tectona-dev.adira.co.id'
        if (!isLocal && !isDevHost) return
        if (!('serviceWorker' in navigator)) return
        var FLAG = 'tectona:sw-layout-fullwidth-v3'
        var hadController = Boolean(navigator.serviceWorker.controller)
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(
            regs.map(function (reg) {
              return reg.unregister()
            }),
          )
        }).then(function () {
          if (!('caches' in window)) return
          return caches.keys().then(function (keys) {
            return Promise.all(
              keys.map(function (key) {
                return caches.delete(key)
              }),
            )
          })
        }).then(function () {
          if (!hadController || sessionStorage.getItem(FLAG) === '1') return
          sessionStorage.setItem(FLAG, '1')
          location.reload()
        }).catch(function () {})
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
