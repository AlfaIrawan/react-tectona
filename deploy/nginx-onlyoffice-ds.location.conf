# Sisipkan di server { } tectona-dev.adira.co.id (react-tectona.conf)
# WAJIB `^~` agar tidak jatuh ke `location /` → index.html (itu penyebab api.js Unexpected token '<').
#
#   sudo cp ... /etc/nginx/sites-available/react-tectona
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -sI https://tectona-dev.adira.co.id/onlyoffice-ds/web-apps/apps/api/documents/api.js
#   → Content-Type: application/javascript  (bukan text/html)

location ^~ /onlyoffice-ds/ {
    proxy_pass http://127.0.0.1:8085/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    client_max_body_size 200m;
}
